name: Lighthouse CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          npm ci
          npm run build
      - name: Start Next server
        run: |
          npm run start &
          npx wait-on http://localhost:3000
      - name: Run Lighthouse CI
        run: |
          npx @lhci/cli autorun --collect.url=http://localhost:3000 --upload.target=temporary-public-storage
      - name: Comment results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.lighthouseci/';
            let summary = 'Lighthouse report uploaded. See artifacts.';
            try {
              const files = fs.readdirSync(path);
              const html = files.find(f => f.endsWith('.html'));
              if (html) summary = `Lighthouse report generated: ${html}`;
            } catch {}
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

